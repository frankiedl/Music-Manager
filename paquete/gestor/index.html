<!doctype html>
<!-- Music Manager UI: the whole single-page client (HTML + CSS + one main script). UI text is written in Spanish and translated
     at runtime by /mod/_core/i18n.js; modules hook in through /mod/_core/gm.js. See ARCHITECTURE.md (key functions: init, go, render*). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi música</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--panel2:rgba(120,120,128,.12);--line:rgba(60,60,67,.14);--txt:#1d1d1f;--muted:#86868b;--accent:#fa2d48;--good:#30a46c;--warn:#e8a300;--bad:#e5484d;--glass:rgba(255,255,255,.72);--side:rgba(246,246,248,.8);--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--panel:#1c1c1e;--panel2:rgba(120,120,128,.24);--line:rgba(84,84,88,.5);--txt:#f5f5f7;--muted:#98989f;--accent:#ff375f;--good:#32d583;--warn:#ffd60a;--bad:#ff6961;--glass:rgba(28,28,30,.72);--side:rgba(30,30,32,.7);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;display:grid;grid-template-columns:248px 1fr;grid-template-rows:1fr auto;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* ---- navigation ---- */
#nav{background:var(--side);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font-size:19px;font-weight:700;letter-spacing:-.03em;padding:2px 10px 12px}
.brand{display:flex;align-items:flex-start;justify-content:space-between}
.gear{background:none;border:0;padding:6px;border-radius:9px;color:var(--muted);margin-top:-2px;display:grid;place-items:center}
.gear svg{width:19px;height:19px}
.gear:hover,.gear.on{background:var(--panel2);color:var(--txt)}
.navsep{border:0;border-top:1px solid var(--line);margin:8px 10px}
.gm-home h1{display:none}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:1px}
#q{width:100%;border:0;background:var(--panel2);border-radius:10px;padding:9px 12px;font:inherit;color:var(--txt);outline:none;margin-bottom:10px}
#q:focus,textarea:focus,.pk input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.nv{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;font-size:14.5px;font-weight:500;width:100%}
.nv:hover{background:var(--panel2)}
.nv.on{background:var(--accent);color:#fff}
.nv .ic{width:22px;text-align:center;font-size:17px}
.nv .bd{margin-left:auto;background:var(--accent);color:#fff;font-size:11.5px;border-radius:99px;padding:1px 8px;font-weight:600}
.nv.on .bd{background:#fff;color:var(--accent)}
.sp{flex:1}
#saved{font-size:12px;color:var(--muted);padding:6px 12px;min-height:26px}
/* ---- contenido ---- */
main{overflow:auto;padding:30px 34px 40px;min-width:0}
h1{font-size:34px;font-weight:700;letter-spacing:-.035em;margin:0 0 4px}
h2{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:30px 0 12px}
.lead{color:var(--muted);font-size:15px;margin:0 0 20px;max-width:640px}
.meta{color:var(--muted);font-size:12.5px}
.back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:500;padding:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 16px}
.chip{border:0;background:var(--panel2);padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:500;transition:background .15s,transform .1s}
.chip:hover{background:color-mix(in srgb,var(--txt) 16%,transparent)}.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#fff}
.chip.pri{background:var(--accent);color:#fff}
.b{border-radius:99px;background:var(--panel2);padding:3px 11px;font-size:12px;display:inline-block}
.b.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.b.no{color:var(--muted)}
.b.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tag{border-radius:99px;background:var(--panel2);padding:1px 8px;font-size:11.5px}
.tag.fin{background:var(--accent);color:#fff;font-weight:600}
.tag.reg{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
/* ---- paneles ---- */
.panel{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.tile .n{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.1}.tile .l{font-size:13.5px;margin-top:2px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.task{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
.task:hover{transform:translateY(-2px)}
.task .n{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
.task .t{font-weight:600;font-size:15px}.task.done .n{color:var(--good)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ch h4,.sec>h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 10px}
.row{display:flex;align-items:center;gap:14px}
/* ---- cover wall ---- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px}
.gc{position:relative;cursor:pointer}
.gc img,.nocov{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.nocov{display:grid;place-items:center;background:var(--panel2);color:var(--muted);text-align:center;padding:10px;font-size:13px}
.gc:hover img,.gc:hover .nocov{transform:scale(1.03);box-shadow:0 14px 36px rgba(0,0,0,.28)}
.gt{margin-top:10px;font-weight:600;font-size:14px}
.bar{height:4px;background:var(--panel2);border-radius:3px;margin:7px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
/* ---- song list ---- */
.srow{display:grid;grid-template-columns:38px 48px 1fr auto;gap:14px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.srow:hover{background:var(--panel2)}
.srow img,.srow .sc0{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel2)}
.srow .st{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .chs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.pbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center;font-size:13px;padding:0;flex:none}
.pbtn:hover{background:var(--accent);color:#fff}
.pbtn.on{background:var(--accent);color:#fff;font-size:11px;letter-spacing:-1px}
/* ---- song page ---- */
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.hero img,.hero .nocov{width:170px;height:170px;border-radius:16px;box-shadow:var(--shadow);aspect-ratio:auto}
.hero .info{flex:1;min-width:240px}
.bigplay{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:10px 22px;font-weight:600;font-size:15px}
.callout{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-radius:14px;padding:14px 16px;margin:14px 0}
.vrow{display:grid;grid-template-columns:36px 1fr auto auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:8px}
.vrow.playing{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.vrow.final{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.vt{font-weight:600;word-break:break-word}
.star{cursor:pointer;color:var(--muted);font-size:16px;letter-spacing:1px}.star.on{color:var(--warn)}
details>summary{cursor:pointer;color:var(--muted);font-weight:500;padding:6px 0;list-style:none}details>summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ ";}
textarea{width:100%;min-height:80px;border:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;font:inherit;color:var(--txt);resize:vertical}
pre{white-space:pre-wrap;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;font:15px/1.65 -apple-system,"Segoe UI",sans-serif;margin:0}
select{border:0;background:var(--panel2);color:var(--txt);border-radius:8px;padding:5px 8px;font:inherit}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px}
.mcard img,.mcard video{width:100%;max-height:160px;object-fit:cover;border-radius:10px}
/* ---- player bar ---- */
#bar{grid-column:1/3;background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-top:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px}
#bar img,#bar .bc0{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel2);box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}
#bar .bi{min-width:140px;max-width:260px;display:flex;flex-direction:column}#bar .bi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{border:0;background:none;font-size:20px}
#bar #bplay{width:42px;height:42px;border-radius:50%;background:var(--txt);color:var(--bg);font-size:17px;display:grid;place-items:center;padding:0}
#bar audio{flex:1;min-width:160px;height:36px}
/* ---- menu, dialogs, notices ---- */
#ctx{position:fixed;z-index:60;min-width:220px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#ctx .ci{padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13.5px}#ctx .ci:hover{background:var(--accent);color:#fff}#ctx hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:20px}
.dlg{background:var(--panel);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:24px;width:min(520px,100%);max-height:86vh;overflow:auto}
.dlg h3{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.pk input{width:100%;border:0;background:var(--panel2);border-radius:10px;padding:10px 12px;font:inherit;color:var(--txt);outline:none;margin:12px 0 8px}
.pk .res{max-height:300px;overflow:auto}
.pk .it{padding:9px 10px;border-radius:9px;cursor:pointer}.pk .it:hover{background:var(--accent);color:#fff}.pk .it small{opacity:.7}
.steps{display:grid;gap:12px;margin-top:14px}.steps div{display:flex;gap:12px;align-items:flex-start}.steps b{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;font-size:13px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:90}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}#nav{flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand,.qw,#q,.sp,#saved{display:none}.nv{width:auto;white-space:nowrap}#bar{grid-column:1}main{padding:18px}}

/* ===== smooth motion, no flashes ===== */
html{background:var(--bg);color-scheme:light dark}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
@keyframes spinpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
main.in>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
main.in>*:nth-child(2){animation-delay:.04s}main.in>*:nth-child(3){animation-delay:.08s}main.in>*:nth-child(4){animation-delay:.12s}main.in>*:nth-child(n+5){animation-delay:.16s}
main.in .tile,main.in .task,main.in .gc,main.in .vrow,main.in .mcard{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
main.in .tiles>:nth-child(1),main.in .tasks>:nth-child(1),main.in .wall>:nth-child(1){animation-delay:.05s}
main.in .tiles>:nth-child(2),main.in .tasks>:nth-child(2),main.in .wall>:nth-child(2){animation-delay:.09s}
main.in .tiles>:nth-child(3),main.in .tasks>:nth-child(3),main.in .wall>:nth-child(3){animation-delay:.13s}
main.in .tiles>:nth-child(4),main.in .tasks>:nth-child(4),main.in .wall>:nth-child(4){animation-delay:.17s}
main.in .tiles>:nth-child(n+5),main.in .tasks>:nth-child(n+5),main.in .wall>:nth-child(n+5){animation-delay:.21s}
img.ld{opacity:0;transition:opacity .5s ease}img.ld.ok{opacity:1}
.nv,.chip,.pbtn,.task,.gc,.srow,.vrow{transition:background .2s,transform .2s,box-shadow .25s,opacity .2s}
.nv:active,.pbtn:active,.bigplay:active{transform:scale(.96)}
.ov{animation:fade .2s both}.dlg{animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
#ctx{animation:pop .14s both}
.nv svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv .ic{display:grid;place-items:center}
.lg{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
#eq{display:flex;gap:3px;align-items:flex-end;height:18px;width:20px;opacity:0;transition:opacity .3s;flex:none}
#eq i{display:block;width:4px;background:var(--accent);border-radius:2px;height:30%}
body.playing #eq{opacity:1}body.playing #eq i{animation:eq .9s ease-in-out infinite}
#eq i:nth-child(2){animation-delay:.2s}#eq i:nth-child(3){animation-delay:.4s}
body.playing #bcov{animation:spinpulse 3s ease-in-out infinite}
.sgrid{display:grid;grid-template-columns:minmax(210px,270px) minmax(250px,330px) minmax(300px,1fr);gap:28px;align-items:start;margin:6px 0 14px}
.sgrid .scov{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:var(--shadow);display:block}
.sgrid .nocov.scov{background:var(--panel2);color:var(--muted)}
.sgrid .stitle{font-size:24px;line-height:1.2;margin:14px 0 6px}
.sgrid .sthemes{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.shd{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:600}
.snow{display:flex;flex-direction:column;gap:7px;font-size:14px}
.sc3 .sec{margin-top:0}
.sc3 #letra{max-height:72vh;overflow:auto}
@media(max-width:1280px){.sgrid{grid-template-columns:minmax(200px,270px) 1fr}.sgrid .sc3{grid-column:1/-1}}
@media(max-width:760px){.sgrid{grid-template-columns:1fr}}
.mxwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.mxbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.mxbar label{display:flex;gap:7px;align-items:center}
.mxsel{width:17px;height:17px;accent-color:var(--accent)}
.mst{margin-top:2px}
.mxcard{position:relative;cursor:pointer;border-radius:16px;padding:8px;transition:background .2s,transform .2s}
.mxcard:hover{background:var(--panel2)}
.mxcard.act{outline:2px solid var(--accent);outline-offset:-2px}
.mxs{position:absolute;top:14px;left:14px;z-index:2;border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.mxs.on{background:var(--accent)}
#fmix.on{background:color-mix(in srgb,var(--accent) 22%,var(--panel2));font-weight:600}
.mxx{position:absolute;top:14px;right:14px;z-index:2;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;padding:0;display:grid;place-items:center;opacity:.85;backdrop-filter:blur(6px)}
.mxx:hover{background:var(--bad);opacity:1}
.mxcard img{width:100%;aspect-ratio:1.5;border-radius:12px;box-shadow:var(--shadow);display:block;object-fit:cover;background:var(--panel2)}
.mxtop{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.mxcover img{width:290px;height:auto;aspect-ratio:1.5;border-radius:14px;box-shadow:var(--shadow);display:block;background:var(--panel2);object-fit:cover}
.mxfields{display:flex;flex-direction:column;gap:9px;flex:1;min-width:240px}
.mxfields label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.mxrow{display:flex;gap:12px;flex-wrap:wrap}
.mxin{width:100%;border:0;background:var(--panel2);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit;outline:none;margin:4px 0 10px}
.mxfields .mxin{margin:0;max-width:380px}
.sdz.dover,.mxcard.dover{outline:2px dashed var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.gtabs{display:flex;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.cwrap{position:relative;display:inline-block;max-width:100%;line-height:0;margin:6px 0;user-select:none;touch-action:none;overflow:hidden;border-radius:8px}
.cwrap img{max-width:100%;max-height:50vh;display:block}
#cbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.cfm{display:flex;gap:6px;margin:8px 0;align-items:center;flex-wrap:wrap}
.cprev{display:flex;gap:12px;align-items:flex-end;margin:10px 0;flex-wrap:wrap}
.cprev canvas{border-radius:6px;box-shadow:var(--shadow);cursor:pointer;max-width:120px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);transition:.2s;margin-top:12px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--txt);transform:scale(1.01)}
.drop .chips{justify-content:center;margin:10px 0 0}
.sdz{margin:12px 0;padding:6px;border:2px dashed transparent;border-radius:14px;transition:.2s}.sdz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
#upl{position:fixed;right:22px;bottom:96px;width:300px;background:var(--panel);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:14px 16px;z-index:85;animation:pop .25s both}
#upl .bar{margin:8px 0 2px;height:6px}#upl .bar i{transition:width .2s}
.lyr textarea{min-height:340px;font:15px/1.65 -apple-system,"Segoe UI",sans-serif}
.lacts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.lacts label.chip{display:inline-block}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ===== songs column ===== */
body{grid-template-columns:232px 330px 1fr}
#slist{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#slist .sh{padding:18px 14px 8px;display:grid;gap:8px}
#slist #q{margin:0}
#addsongs{width:100%;padding:9px 13px;font-size:13.5px}#addsongs.over{outline:2px dashed #fff;outline-offset:-4px}
.addz{border:2px dashed var(--line);border-radius:18px;padding:30px 18px;text-align:center;margin:14px 0}.addz.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

const LOGO={

// master = a file in a «master» folder, or a version you chose as final (★)
const hasMaster=s=>s.versions.some(v=>v.dep||/\/master\//i.test(v.p))||!!(ST.final[s.id]&&s.versions.some(v=>v.p===ST.final[s.id]));

function dupPairs(){
  const wz=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

  const jac=(A,B)=>{let i=0;const [a,b]=A.size<B.size?[A,B]:[B,A];a.forEach(v=>{if(b.has(v))i++});return i/(A.size+B.size-i||1)};

    case 'play':return play(p);

async function unirVarias(){
  const L=[...msel].map(id=>ALL.find(z=>z.id===id)).filter(Boolean);if(L.length<2)return;
  const score=s=>(isPub(s)?1000:isPre(s)?500:0)+realVers(s).length;
  const best=[...L].sort((a,b)=>score(b)-score(a))[0];
  const keep=await new Promise(res=>{const o=modal(`<h3>Fusionar canciones</h3><p class="meta" style="font-size:14px">Se unirán ${L.length} entradas en una sola. Los archivos de audio de las demás pasan a la carpeta de la que se queda, y sus letras se conservan si la que se queda no tiene. Puedes deshacerlo con el diario de movimientos.</p>
    <div style="margin:12px 0"><b>¿Cuál se queda (con su nombre y su carpeta)?</b>${L.map(s=>`<label style="display:block;margin:8px 0"><input type="radio" name="nm" value="${s.id}"${s===best?' checked':''}> «${esc(clean(s.title))}» <span class="meta">· ${esc(D(s).split('/').slice(0,2).join('/')||'sin carpeta')} · ${s.versions.length} archivo(s)${isPub(s)?' · publicada':isPre(s)?' · pre-released':''}</span></label>`).join('')}</div>
    <div class="acts"><button class="chip" data-r="0">Cancelar</button><button class="chip pri" data-r="1">Unir</button></div>`);
    o.onclick=e=>{const r=e.target.dataset.r;if(r!==undefined||e.target===o){const v=(o.querySelector('input[name=nm]:checked')||{}).value;o.remove();res(r==='1'?v:null)}}});
  if(!keep)return;
  const dest=L.find(s=>s.id===keep);let ok=0;
  for(const s of L){if(s.id===keep)continue;
    const r=await fetch('/api/unir',{method:'POST',body:JSON.stringify({desde:s.id,hacia:keep,nombre:'destino'})}).then(r=>r.json()).catch(()=>({ok:false}));
    if(!r.ok){await ask('No se pudo unir','«'+esc(clean(s.title))+'» → «'+esc(clean(dest.title))+'»<br><br><span style="font-size:13px;word-break:break-word">'+esc(r.error||'El servidor no respondió. ¿Sigue abierto el gestor?')+'</span>','Entendido');break}ok++}
  await reload();clearSel();refresh();if(ok)toast(ok+' unida'+(ok>1?'s':'')+' a «'+clean(dest.title)+'» ✓')}
