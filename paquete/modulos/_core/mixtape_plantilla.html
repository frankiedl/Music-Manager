<!doctype html>
<html lang="%%LANG%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{--bg:#15171b;--panel:#1f2228;--panel2:#272b33;--line:#343944;--txt:#f2f3f5;--muted:#9aa0ab;--acc:#f4c20d;--onacc:#1a1500}
*{box-sizing:border-box}html,body{overflow-x:clip}
html{background:var(--bg)}body{min-height:100vh;background-repeat:no-repeat;transition:background .6s;margin:0;background:radial-gradient(900px 520px at 50% -10%,var(--tint,#2b2f38),transparent),var(--bg);color:var(--txt);font:16px/1.5 "Roboto","Segoe UI",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:6px}header h1{margin:0;font-weight:300;font-size:28px;letter-spacing:.2px}header p{margin:2px 0 0;color:var(--muted)}
/* walkman */
.sw{max-width:380px;margin:8px auto 0}
.stage{position:relative;height:0;padding-bottom:103.7%}.stage svg{position:absolute;inset:0;width:100%;height:100%}

svg{display:block;width:100%;height:auto}
#cas1,#cas2{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.out #cas1,.out #cas2{transform:translateX(46px)}
#cas1{opacity:0}.open #cas1{opacity:1}
#lidW{transform-origin:130px 206px;transition:transform .9s cubic-bezier(.5,0,.2,1);transform:none}
.open #lidW{transform:skewY(-5deg) scaleX(-.42)}
#lidOut{opacity:1;transition:opacity 0s .3s}#lidIn{opacity:0;transition:opacity 0s .3s}
.open #lidOut{opacity:0;transition:opacity 0s .5s}.open #lidIn{opacity:1;transition:opacity 0s .5s}
.reel{transform-box:fill-box;transform-origin:center}
.play .reel{animation:giro 2.4s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.cs{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin:10px 0 0}.cs div{display:flex;gap:6px}.cs button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}.cs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr) minmax(0,1.15fr);gap:28px;align-items:start;margin-top:8px}
.c1 .sw{margin-top:0}.c2 h2.ct{margin:6px 0 10px;font-size:13px;font-weight:500;color:var(--muted)}.c2 ol{margin:0}
.c3 .nota{margin:0}
.base{margin:22px 0 22px;max-width:none}
.frame{position:relative;filter:drop-shadow(0 12px 12px rgba(0,0,0,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.frame::before{content:"";position:absolute;left:50%;top:-14px;width:110px;height:28px;margin-left:-55px;transform:rotate(-2deg);z-index:2;background:linear-gradient(100deg,rgba(255,255,255,.45),rgba(210,205,190,.55) 30%,rgba(235,232,220,.5) 55%,rgba(200,196,180,.55));box-shadow:0 1px 3px rgba(0,0,0,.25);clip-path:polygon(0 8%,3% 0,97% 4%,100% 0,98% 52%,100% 100%,3% 96%,0 100%,2% 50%)}
.card{position:relative;padding:34px 26px 34px 62px;color:#2b2b31;background:
 linear-gradient(90deg,transparent 52px,rgba(214,72,86,.75) 52px,rgba(214,72,86,.75) 53.5px,transparent 53.5px),
 repeating-linear-gradient(180deg,transparent 0 23px,rgba(56,150,160,.55) 23px 24px),
 linear-gradient(#f7f5ef,#efece3);background-position:0 0,0 10px,0 0;
 box-shadow:inset 0 0 40px rgba(120,100,60,.12)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:44px;background:radial-gradient(circle at 22px 34px,#15161a 0 6px,rgba(0,0,0,.35) 6px 7.500px,transparent 8px);background-size:44px 48px;background-repeat:repeat-y}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;min-height:48px}
.hd b{font:400 26px/1.05 'Ink Free','Segoe Print','Segoe Script','Bradley Hand',cursive;color:#1d2c78;transform:rotate(-1.2deg);transform-origin:left bottom;overflow-wrap:anywhere}
.hd span{font:400 19px 'Ink Free','Segoe Print','Segoe Script','Bradley Hand',cursive;color:#1d2c78;transform:rotate(1deg)}
.sub{font:10pt/24px "Courier New",Courier,monospace;color:#555;margin:0;min-height:24px}
.base p{margin:0;font:11pt/24px "Courier New",Courier,monospace;color:#2b2b31;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;min-height:48px}.base p.v{color:#8a8a8e}
.ft{display:flex;justify-content:flex-end;align-items:center;margin-top:18px}.sig{font:400 22px/1 'Ink Free','Segoe Print','Segoe Script','Bradley Hand',cursive;color:#1d1d78;transform:rotate(-2deg)}.dot{display:none}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 0;color:var(--muted)}
.vol svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vol input{width:150px;accent-color:var(--acc);height:4px}
.vol output{min-width:3ch;font-size:12px;text-align:right}
.nota{overflow:visible;max-height:none}.nota p{overflow:visible}
main{max-width:1560px}
.cols{grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1fr);gap:40px}
.hh{text-align:center;margin:0 0 6px}.hh h1{font-size:30px}
.contact{margin-top:34px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}.contact a{color:var(--txt);text-decoration:underline;text-underline-offset:3px}
.contact a.mail{display:block;width:max-content;margin:0 auto;font-size:17px}
.contact a.ig{display:block;width:max-content;margin:6px auto 0;font-size:17px}.contact .tel{display:block;width:max-content;margin:6px auto 0;font-size:26px;line-height:1;font-weight:300;text-decoration:none;white-space:nowrap}
.c1 .bar,.c1 .vol{max-width:260px;margin-left:auto;margin-right:auto}.c1 .now{margin-bottom:6px}
.c2 .base{margin:6px 0 24px}.c2 h2.ct{margin:0 0 12px 50px}
.tl{position:relative;padding-left:50px}
.tl::before{content:"";position:absolute;left:14px;top:26px;bottom:38px;width:2px;background:var(--acc);opacity:.8}
.tl ol{margin:0;display:grid;gap:10px}
.tl li{position:relative}
.tl li .ck{position:absolute;left:-50px;top:50%;margin:-14px 0 0 0;width:28px;height:28px;appearance:none;-webkit-appearance:none;background:#050506;border:2px solid var(--acc);border-radius:3px;cursor:pointer;transition:background .15s}
.tl li .ck:checked{background:var(--acc)}.tl li .ck:focus-visible{outline:2px solid var(--txt);outline-offset:3px}
.tl li.on{box-shadow:0 0 0 2px var(--acc);background:var(--panel2)}
.dlb{position:relative;height:48px;margin:16px 0 0 0;display:flex;align-items:center;padding:12px 26px;border-radius:99px;border:3px solid var(--acc);background:transparent;color:var(--acc);font:500 13px/1.2 inherit;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:opacity .15s,background .15s}
.dlb::before{content:"";position:absolute;left:-39px;top:calc(50% - 22px);width:36px;height:22px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);border-bottom-left-radius:14px;opacity:.8}
.dlb:not(:disabled):hover{background:var(--acc);color:var(--onacc)}.dlb:disabled{opacity:.55;cursor:default}
.tl::after{content:"";position:absolute;left:14px;bottom:28px;width:2px;height:0}
@media (max-width:900px){
.cols{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.c1,.c2{display:contents}
.hh{order:1}.sw{order:2;width:100%}
.pl{order:3;position:sticky;top:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin:0 -14px;padding:8px 14px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pl .now{grid-column:1;grid-row:1;text-align:left;margin:0;min-width:0}.pl .now b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .now span{font-size:12px}
.pl .ctl{grid-column:2;grid-row:1;margin:0;gap:6px}.pl .ctl button{width:40px;height:40px;font-size:15px}.pl .ctl #pp{width:46px;height:46px;font-size:18px}
.pl .seekrow{grid-column:1/-1;grid-row:2;max-width:none;margin:0}
.pl #err{grid-column:1/-1;grid-row:3;min-height:0;font-size:12px}.pl .vol{display:none}
.base{order:4;width:100%;margin:6px 0 0}.c3{order:5}.c2 h2.ct{order:6;margin:14px 0 0 50px}.tl{order:7}.contact{order:8;margin:22px 0 6px}
#h-ly{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin:0;padding:4px 0;-webkit-tap-highlight-color:transparent}
#h-ly::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-right:4px}
#lb.abierta #h-ly{margin-bottom:8px}#lb.abierta #h-ly::after{transform:rotate(-135deg)}
#lb:not(.abierta) #lyr{display:none}
#h-ly:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
main{padding:14px 14px 28px}
.card{padding:30px 18px 30px 52px}
.card::before{width:36px;background-size:36px 48px;background-position:0 0}
.hd b{font-size:24px}.hd span{font-size:17px}
.dlb{max-width:100%;padding:10px 18px;font-size:12px}
.hh h1{font-size:26px}
.contact .tel{font-size:24px}
}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr);gap:20px}}
/* player */
.now{text-align:center;margin:14px 0 4px}.now b{display:block;font-size:20px;font-weight:500}.now span{color:var(--muted);font-size:14px}
.ctl{display:flex;gap:14px;align-items:center;justify-content:center;margin:10px 0}
.ctl button{border:0;border-radius:50%;width:46px;height:46px;background:var(--panel2);color:var(--txt);font-size:18px;cursor:pointer}
.ctl #pp{width:60px;height:60px;background:var(--acc);color:var(--onacc);font-size:22px}
.ctl button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.bar{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
/* list */
ol{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--panel);cursor:pointer;transition:background .15s}
li:hover{background:var(--panel2)}li.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
li b{font-weight:300;color:var(--muted);min-width:2ch}li span{flex:1}li small{color:var(--muted)}
li .n{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.lyr{white-space:pre-wrap}#lp{line-height:1.75}
/* note */
.nota{margin:16px 0 0;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.nota h2{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.nota p{margin:0;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}.nota p.v{color:var(--muted)}
footer a{color:var(--acc)}footer{text-align:center;color:var(--muted);margin-top:26px;font-size:14px}
@media (prefers-reduced-motion:reduce){#cas1,#cas2,#lidW{transition:none}.play .reel{animation:none}}
.seekrow{display:flex;align-items:center;gap:8px;max-width:300px;margin:8px auto 0;font-size:12px;color:var(--muted)}
.seekrow input{flex:1;min-width:0;accent-color:var(--acc);height:4px}
#err{min-height:1.2em;text-align:center;color:var(--acc);font-size:13px}
#lyr{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:inherit;line-height:1.75}
.tl li span{flex:1}.tl li small{color:var(--muted)}
.base[hidden]{display:none}
.nota h2{margin:0 0 8px}
</style>
</head>
<body>
<main>
<div class="cols">
<div class="c1"><header class="hh"><h1 id="ttl"></h1><p id="art" class="art"></p></header>
<div class="sw"><div class="stage open out" id="st">
<svg viewBox="50 70 270 280" role="img" aria-label="Walkman amarillo con la cinta">
<defs>
 <linearGradient id="gy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd83d"/><stop offset=".55" stop-color="#f2b900"/><stop offset="1" stop-color="#d99e00"/></linearGradient>
 <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98300"/><stop offset=".5" stop-color="#e4b000"/><stop offset="1" stop-color="#f4c20d"/></linearGradient>
 <mask id="mk" maskUnits="userSpaceOnUse" x="100" y="80" width="200" height="260"><rect x="100" y="80" width="200" height="260" fill="#fff"/><rect x="143" y="111" width="124" height="190" rx="62" fill="#000"/></mask>
 <radialGradient id="gs" cx=".5" cy=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<defs id="cd"></defs>
<ellipse cx="203" cy="332" rx="112" ry="10" fill="url(#gs)"/>
<!-- cuerpo: casi las proporciones de la cinta, un poco mayor para el mecanismo -->
<rect x="130" y="90" width="146" height="232" rx="20" fill="url(#gy)"/>
<rect x="130" y="90" width="146" height="232" rx="20" fill="none" stroke="#a97800" stroke-opacity=".5" stroke-width="2"/>
<path d="M146 92h70c-24 50-40 130-40 228h-40a20 20 0 0 1-20-20V112a20 20 0 0 1 30-20z" fill="#fff" fill-opacity=".10"/>
<g fill="#8d6a00" fill-opacity=".55"><circle cx="138" cy="99" r="2.500"/><circle cx="268" cy="99" r="2.500"/><circle cx="138" cy="313" r="2.500"/><circle cx="268" cy="313" r="2.500"/></g>
<rect x="140" y="100" width="126" height="212" rx="9" fill="#17181b"/>
<rect x="140" y="100" width="126" height="212" rx="9" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="3"/>
<g><rect x="247" y="186" width="14" height="40" rx="3" fill="#8a8d94"/><rect x="243" y="196" width="6" height="20" rx="2" fill="#5a5d64"/><circle cx="254" cy="150" r="5" fill="#2b2d33" stroke="#555"/><circle cx="254" cy="262" r="5" fill="#2b2d33" stroke="#555"/><rect x="146" y="106" width="16" height="8" rx="3" fill="#2b2d33"/><rect x="146" y="298" width="16" height="8" rx="3" fill="#2b2d33"/></g>
<g id="cas2"><g class="cc" transform="translate(263 114) rotate(90)"></g></g>
<!-- puerta del lado de los botones, abierta solo un poco -->
<g id="lidW">
 <g id="lidOut">
  <rect x="130" y="90" width="146" height="232" rx="20" fill="url(#gy)" mask="url(#mk)"/>
  <rect x="130" y="90" width="146" height="232" rx="20" fill="none" stroke="#a97800" stroke-opacity=".5" stroke-width="2"/>
  <path d="M146 92h70c-24 50-40 130-40 228h-40a20 20 0 0 1-20-20V112a20 20 0 0 1 30-20z" fill="#fff" fill-opacity=".10" mask="url(#mk)"/>
  <rect x="143" y="111" width="124" height="190" rx="62" fill="#1b1c20" fill-opacity=".2" stroke="#101113" stroke-width="10"/>
  <rect x="148" y="116" width="114" height="180" rx="57" fill="none" stroke="#17a88c" stroke-width="2"/>
  <path d="M170 128l40-6v168l-46 4z" fill="#fff" fill-opacity=".06"/>
  <circle cx="141" cy="100" r="3.500" fill="#c96a1a"/>
  
  <text x="266" y="316" text-anchor="end" font-size="8" fill="#4a4a46" font-family="Roboto,Segoe UI,sans-serif">FM/AM</text>
  <g fill="#0e0f11"><rect x="126" y="130" width="8" height="150" rx="3"/></g>
 </g>
 <g id="lidIn">
  <rect x="130" y="90" width="146" height="232" rx="20" fill="url(#gd)"/>
  <rect x="130" y="90" width="146" height="232" rx="20" fill="none" stroke="#a97800" stroke-opacity=".5" stroke-width="2"/>
  <rect x="140" y="100" width="126" height="212" rx="12" fill="#c99200" fill-opacity=".75"/>
  <rect x="190" y="126" width="26" height="130" rx="13" fill="#17181b" fill-opacity=".85"/>
  <circle cx="203" cy="284" r="11" fill="#17181b" fill-opacity=".85"/>
  <g fill="#202227"><rect x="142" y="118" width="22" height="22" rx="5"/><rect x="142" y="152" width="22" height="22" rx="5"/><rect x="142" y="186" width="22" height="22" rx="5"/><rect x="142" y="220" width="22" height="22" rx="5"/></g>
  <rect x="133" y="96" width="5" height="220" rx="2.500" fill="#c3c6cc"/>
  <g fill="#8e9199"><rect x="127" y="108" width="8" height="20" rx="2.500"/><rect x="127" y="196" width="8" height="20" rx="2.500"/><rect x="127" y="284" width="8" height="20" rx="2.500"/></g>
  <path d="M146 104h40l-20 100h-20z" fill="#fff" fill-opacity=".10"/>
 </g>
</g>
<g id="cas1"><g class="cc" transform="translate(263 114) rotate(90)"></g></g>
</svg></div></div>
<div class="pl"><div class="now"><b id="nt"></b><span id="ns"></span></div>
<div class="seekrow"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
<div id="err" role="status"></div>
<div class="ctl"><button id="pv" type="button">&#9198;</button><button id="pp" type="button">&#9654;</button><button id="nx" type="button">&#9197;</button></div>
<label class="vol"><svg viewBox="0 0 24 24" id="vi"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="vw" d="M16 9a4 4 0 0 1 0 6M18.500 6.500a8 8 0 0 1 0 11"/></svg><input id="vol" type="range" min="0" max="1" step="0.05" value="1"><output id="vo">100%</output></label>
</div>
<div class="contact" id="ct" hidden></div></div>
<div class="c2"><section class="base" id="nb" hidden><div class="frame"><div class="card">
<div class="hd"><b id="bt"></b><span id="by"></span></div><div class="sub" id="bs"></div><p id="np"></p>
<div class="ft"><span class="sig" id="sg"></span><i class="dot"></i></div></div></div></section>
<h2 class="ct" id="h-tr"></h2><div class="tl"><ol id="list"></ol><button type="button" id="dl" class="dlb" disabled></button></div></div>
<div class="c3"><section class="nota" id="lb"><h2 id="h-ly"></h2><pre id="lyr"></pre></section></div>
</div>
</main>
<audio id="au" preload="metadata"></audio>

<script>
(function(){
var D=JSON.parse(document.getElementById('d').textContent),U=D.ui,T=D.tracks;

/*3 clear shell, black label*/{shell:'clear',lab:{y0:34,y1:206,c:['#4a4a50','#2e2e33','#1d1d21'],chamfer:true},hx:[124,276],hy:122,hr:26,win:'rect',hub:'std'},
/*4 clear shell, silver label*/{shell:'clear',lab:{y0:34,y1:206,c:['#eceef1','#b6b9c0','#8e929b'],chamfer:true,notch:true,brushed:true},hx:[122,278],hy:122,hr:26,win:'rect',hub:'std'},
